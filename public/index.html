<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AI Probability Demo</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-2xl bg-white rounded-lg shadow-md p-8">
    <h1 class="text-3xl font-bold mb-6 text-center">
      LLM Probability Demo
    </h1>

    <label for="prompt-input" class="block text-lg font-semibold mb-2">
      Enter your prompt:
    </label>
    <textarea
      id="prompt-input"
      rows="3"
      class="block w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
    ></textarea>

    <button
      id="submit-prompt"
      class="mt-4 px-6 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors"
    >
      Submit
    </button>

    <div
      id="result-container"
      class="result-container mt-6 bg-gray-50 p-4 rounded-md min-h-[50px]"
    >
      <!-- Tokens will appear here -->
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
